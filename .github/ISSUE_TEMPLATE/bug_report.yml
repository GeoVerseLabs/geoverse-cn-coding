name: 缺陷报告
description: 服务报错、结果异常或文档与行为不符
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 发生了什么，期望是什么
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请求或命令、参数；去掉个人信息
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 版本号或提交，以及 /v1/meta 返回的 built_at
  - type: textarea
    id: logs
    attributes:
      label: 日志或返回内容
      render: json
