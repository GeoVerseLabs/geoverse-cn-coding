name: 需求建议
description: 新功能、新数据源或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
  - type: textarea
    id: data
    attributes:
      label: 涉及的数据源
      description: 如涉及新数据，请写明来源、许可和更新频率
